name: Validate Adapters

on:
  push:
    # main serves registry.json directly, so validate the exact SHA on a branch
    # before branch protection permits that SHA to land on main.
    branches: ["**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  validate:
    # Standard hosted compute is free for this public repository.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Release metadata intentionally pins the immutable content commit,
          # which can predate the metadata-only commit under validation.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "25.9.0"

      - name: Install validation dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq sqlite3 liburi-perl python3-venv
          python3 -m venv "$RUNNER_TEMP/validation-python"
          "$RUNNER_TEMP/validation-python/bin/pip" install --quiet jsonschema PyYAML
          echo "$RUNNER_TEMP/validation-python/bin" >> "$GITHUB_PATH"

      - name: Verify validation tools and runner policy
        run: |
          node --version
          jq --version
          sqlite3 --version
          perl -MURI::Escape -e 'exit 0'
          python3 -c 'import jsonschema, yaml'
          python3 tests/validation_workflow_test.py

      - name: Validate manifests against JSON schema
        run: |
          python3 check-schemas.py

      - name: Make validate-adapter.sh executable
        run: chmod +x validate-adapter.sh

      - name: Validate all adapters
        run: |
          failed=0
          for dir in adapters/*/; do
            # Skip shared asset dirs (e.g. shared/) — no adapter.json, not adapters.
            [ -f "${dir}adapter.json" ] || { echo "=== Skipping ${dir} (no adapter.json) ==="; continue; }
            echo "=== Validating ${dir} ==="
            if ! ./validate-adapter.sh "$dir"; then
              echo "FAILED: ${dir}"
              failed=1
            fi
          done
          if [ "$failed" -eq 1 ]; then
            echo "One or more adapters failed validation."
            exit 1
          fi
          echo "All adapters passed validation."

      - name: Validate recent-session source metadata
        run: bash tests/list-recent-sessions-source-path.assert.sh

      - name: Validate grok launcher catalog
        run: |
          bash tests/grok-launcher-catalog.assert.sh

      - name: Validate goose launch-profile flag plumbing
        run: bash tests/goose-launch-profile-flags.assert.sh

      - name: Validate goose session-DB resolution
        run: bash tests/goose-session-db-resolution.assert.sh

      - name: Validate goose extractor against a 1.50 fixture
        run: bash adapters/goose/tests/extractor/assert.sh

      - name: Validate goose hook relay (fold + pane id)
        run: bash adapters/goose/tests/relay.assert.sh

      - name: Validate Hermes transcript recovery
        run: python3 -m unittest discover -s adapters/hermes/tests -p '*_test.py'

      - name: Validate package-manager-aware update checks
        run: bash tests/homebrew-managed-updates.assert.sh

      - name: Validate mise- and npm-prefix-aware update routing
        run: bash tests/mise-managed-updates.assert.sh

      - name: Validate kimi workspace-trust pre-accept
        run: bash tests/kimi-workspace-trust.assert.sh

      - name: Validate Claude root bypass compatibility
        run: bash tests/claude-root-bypass.assert.sh

      - name: Validate atrium bug-report contract
        run: bash tests/atrium-bug-report-contract.assert.sh

      - name: Validate immutable release metadata
        run: |
          node scripts/test-runtime-tree-digest.mjs
          node scripts/test-release-generation.mjs
          node scripts/generate-release-metadata.mjs --check

      - name: Validate computer-use client from its shipped reference
        run: node --test scripts/test-computer-client.mjs

      - name: Validate previous-client skill manifest compatibility
        run: |
          jq -e '.version == 1 and (.references | all(type == "string"))' \
            skills/atrium/skill-assets.json >/dev/null

      # canonical-assets.json enumerates the atrium-owned files atrium pushes to
      # user installs beyond per-adapter skills (the home context file, bundled
      # skills, future global assets). atrium reads it at launch + on a periodic
      # cadence to keep those files fresh without a relaunch. A listed file that
      # doesn't exist on disk silently never reaches users — fail the build.
      - name: Validate canonical-assets manifest
        run: |
          manifest=canonical-assets.json
          [ -f "$manifest" ] || { echo "No $manifest; skipping"; exit 0; }
          jq empty "$manifest" || { echo "::error::$manifest is not valid JSON"; exit 1; }
          failed=0
          count=$(jq '.assets | length' "$manifest")
          jq -e '.source.generation | type == "number" and floor == . and . > 0' "$manifest" >/dev/null \
            || { echo "::error::canonical-assets.json source.generation must be a positive integer"; exit 1; }
          for i in $(seq 0 $((count - 1))); do
            target=$(jq -r ".assets[$i].target" "$manifest")
            remote=$(jq -r ".assets[$i].remotePath" "$manifest")
            id=$(jq -r ".assets[$i].id // .assets[$i].remotePath" "$manifest")
            if [ ! -f "$remote" ]; then
              echo "::error::canonical-assets '$id': remotePath '$remote' does not exist"
              failed=1
            fi
            case "$target" in
              atrium-home)
                [ -n "$(jq -r ".assets[$i].destName // empty" "$manifest")" ] \
                  || { echo "::error::'$id' target atrium-home requires destName"; failed=1; } ;;
              adapter-skill)
                ;;
              adapter-skill-reference)
                [ -n "$(jq -r ".assets[$i].destName // empty" "$manifest")" ] \
                  || { echo "::error::'$id' target adapter-skill-reference requires destName"; failed=1; } ;;
              bundled-skill)
                [ -n "$(jq -r ".assets[$i].skillName // empty" "$manifest")" ] \
                  || { echo "::error::'$id' target bundled-skill requires skillName"; failed=1; } ;;
              *)
                echo "::error::'$id' has unknown target '$target'"
                failed=1 ;;
            esac
            digest=$(jq -r ".assets[$i].sha256 // empty" "$manifest")
            [[ "$digest" =~ ^[0-9a-f]{64}$ ]] \
              || { echo "::error::'$id' requires a lowercase sha256"; failed=1; }
          done
          if [ "$failed" -eq 1 ]; then exit 1; fi
          echo "canonical-assets.json: all $count assets valid."
